<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="100%" height="100%">
  <defs>
    <!-- Dark Tech Background Gradients -->
    <linearGradient id="bg-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0d14"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>

    <!-- Glowing Accent Gradients -->
    <linearGradient id="cyan-glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0.8"/>
    </linearGradient>

    <linearGradient id="purple-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#ec4899" stop-opacity="0.6"/>
    </linearGradient>

    <linearGradient id="text-gradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="50%" stop-color="#e0f2fe"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>

    <!-- Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.75" stroke-opacity="0.5"/>
    </pattern>

    <!-- Drop Shadow Filter for Text -->
    <filter id="glow-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="text-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.9"/>
    </filter>

    <!-- Embedded CSS Animations -->
    <style>
      @keyframes pulse-node {
        0%, 100% { transform: scale(1); opacity: 0.4; }
        50% { transform: scale(1.4); opacity: 0.9; }
      }
      @keyframes dash-flow {
        0% { stroke-dashoffset: 240; }
        100% { stroke-dashoffset: 0; }
      }
      @keyframes float-particle {
        0% { transform: translateY(0px) translateX(0px); opacity: 0.2; }
        50% { transform: translateY(-15px) translateX(10px); opacity: 0.8; }
        100% { transform: translateY(0px) translateX(0px); opacity: 0.2; }
      }
      @keyframes beam-scan {
        0% { transform: translateX(-100%); }
        100% { transform: translateX(100%); }
      }

      .node-1 { animation: pulse-node 3s infinite ease-in-out; transform-box: fill-box; transform-origin: center; }
      .node-2 { animation: pulse-node 4s infinite ease-in-out 1s; transform-box: fill-box; transform-origin: center; }
      .node-3 { animation: pulse-node 3.5s infinite ease-in-out 2s; transform-box: fill-box; transform-origin: center; }
      
      .line-flow {
        stroke-dasharray: 12, 12;
        animation: dash-flow 8s linear infinite;
      }
      .line-flow-fast {
        stroke-dasharray: 8, 8;
        animation: dash-flow 4s linear infinite;
      }

      .particle-1 { animation: float-particle 5s infinite ease-in-out; }
      .particle-2 { animation: float-particle 7s infinite ease-in-out 1.5s; }
      .particle-3 { animation: float-particle 6s infinite ease-in-out 3s; }
    </style>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="320" fill="url(#bg-gradient)"/>
  <rect width="1200" height="320" fill="url(#grid)"/>

  <!-- Ambient Background Glowing Orbs (Non-obstructive) -->
  <circle cx="150" cy="80" r="180" fill="url(#purple-glow)" opacity="0.3" filter="url(#glow-shadow)"/>
  <circle cx="1050" cy="240" r="220" fill="url(#cyan-glow)" opacity="0.25" filter="url(#glow-shadow)"/>

  <!-- Animated Fiber Optic Network Topology Lines (Behind Text) -->
  <g stroke-linecap="round">
    <!-- Connecting Backbone Paths -->
    <path d="M 50 260 Q 300 200 600 270 T 1150 160" fill="none" stroke="#1e293b" stroke-width="2"/>
    <path d="M 50 260 Q 300 200 600 270 T 1150 160" fill="none" stroke="#06b6d4" stroke-width="2" class="line-flow" opacity="0.7"/>

    <path d="M 100 60 Q 450 140 800 50 T 1100 240" fill="none" stroke="#1e293b" stroke-width="2"/>
    <path d="M 100 60 Q 450 140 800 50 T 1100 240" fill="none" stroke="#3b82f6" stroke-width="2" class="line-flow-fast" opacity="0.6"/>

    <path d="M 200 280 L 400 60 L 850 280 L 1050 70" fill="none" stroke="#8b5cf6" stroke-width="1.5" stroke-dasharray="6,6" opacity="0.3"/>
  </g>

  <!-- Animated Network Nodes (Pulsing in Background Layer) -->
  <g opacity="0.8">
    <circle cx="300" cy="210" r="10" fill="#06b6d4" class="node-1"/>
    <circle cx="300" cy="210" r="4" fill="#ffffff"/>

    <circle cx="450" cy="115" r="12" fill="#3b82f6" class="node-2"/>
    <circle cx="450" cy="115" r="5" fill="#ffffff"/>

    <circle cx="800" cy="50" r="14" fill="#8b5cf6" class="node-3"/>
    <circle cx="800" cy="50" r="6" fill="#ffffff"/>

    <circle cx="950" cy="215" r="10" fill="#06b6d4" class="node-1"/>
    <circle cx="950" cy="215" r="4" fill="#ffffff"/>
  </g>

  <!-- Floating Ambient Particles -->
  <g>
    <circle cx="200" cy="120" r="3" fill="#38bdf8" class="particle-1"/>
    <circle cx="700" cy="250" r="4" fill="#8b5cf6" class="particle-2"/>
    <circle cx="1000" cy="100" r="3" fill="#06b6d4" class="particle-3"/>
    <circle cx="500" cy="280" r="2" fill="#e0f2fe" class="particle-1"/>
  </g>

  <!-- Foreground Foreground Container Cards & Text Overlay (Guaranteed Clear Contrast) -->
  <g filter="url(#text-shadow)">
    <!-- Top Category Pill Tag -->
    <rect x="360" y="42" width="480" height="32" rx="16" fill="#1e293b" fill-opacity="0.8" stroke="#38bdf8" stroke-opacity="0.5" stroke-width="1"/>
    <text x="600" y="63" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#38bdf8" text-anchor="middle" letter-spacing="2">
      ⚡ DEDICATED FABRICS • 100G/400G CONNECTIVITY ⚡
    </text>

    <!-- Main Foreground Title -->
    <text x="600" y="145" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="46" font-weight="900" fill="url(#text-gradient)" text-anchor="middle" letter-spacing="-0.5">
      Awesome High-Speed Cloud Networking
    </text>

    <!-- Subtitle / Architecture Bullet points -->
    <text x="600" y="195" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="17" font-weight="500" fill="#94a3b8" text-anchor="middle" letter-spacing="0.5">
      Curated Cloud Interconnects • eBPF &amp; DPDK Kernels • BGP Fabrics • Multi-Cloud SDN
    </text>

    <!-- Feature Pill Badges Row -->
    <g transform="translate(255, 235)">
      <!-- Pill 1: Hyperscaler Interconnects -->
      <rect x="0" y="0" width="200" height="36" rx="18" fill="#0f172a" fill-opacity="0.9" stroke="#0284c7" stroke-width="1.2"/>
      <text x="100" y="23" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#38bdf8" text-anchor="middle">
        ☁️ AWS / Azure / GCP Links
      </text>

      <!-- Pill 2: Open Source Fabrics -->
      <rect x="220" y="0" width="240" height="36" rx="18" fill="#0f172a" fill-opacity="0.9" stroke="#8b5cf6" stroke-width="1.2"/>
      <text x="340" y="23" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#c084fc" text-anchor="middle">
        🚀 Cilium • SONiC • DPDK • FRR
      </text>

      <!-- Pill 3: SDN & Carrier -->
      <rect x="480" y="0" width="210" height="36" rx="18" fill="#0f172a" fill-opacity="0.9" stroke="#10b981" stroke-width="1.2"/>
      <text x="585" y="23" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#34d399" text-anchor="middle">
        🌐 Megaport • Equinix Fabric
      </text>
    </g>
  </g>
</svg>
