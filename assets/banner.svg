<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" viewBox="0 0 1200 320"><defs><linearGradient id="bg-gradient" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#0a0d14"/><stop offset="50%" stop-color="#0f172a"/><stop offset="100%" stop-color="#020617"/></linearGradient><linearGradient id="cyan-glow" x1="0%" x2="100%" y1="0%" y2="0%"><stop offset="0%" stop-color="#06b6d4" stop-opacity=".8"/><stop offset="100%" stop-color="#3b82f6" stop-opacity=".8"/></linearGradient><linearGradient id="purple-glow" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#8b5cf6" stop-opacity=".6"/><stop offset="100%" stop-color="#ec4899" stop-opacity=".6"/></linearGradient><linearGradient id="text-gradient" x1="0%" x2="100%" y1="0%" y2="0%"><stop offset="0%" stop-color="#fff"/><stop offset="50%" stop-color="#e0f2fe"/><stop offset="100%" stop-color="#38bdf8"/></linearGradient><pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path fill="none" stroke="#1e293b" stroke-opacity=".5" stroke-width=".75" d="M 40 0 L 0 0 0 40"/></pattern><filter id="glow-shadow" width="140%" height="140%" x="-20%" y="-20%"><feGaussianBlur result="blur" stdDeviation="8"/><feComposite in="SourceGraphic" in2="blur" operator="over"/></filter><filter id="text-shadow" width="120%" height="120%" x="-10%" y="-10%"><feDropShadow dx="0" dy="4" flood-color="#000" flood-opacity=".9" stdDeviation="6"/></filter><style>@keyframes pulse-node{0%{transform:scale(1);opacity:.4}50%{transform:scale(1.4);opacity:.9}}@keyframes dash-flow{0%{stroke-dashoffset:240}}@keyframes float-particle{0%{transform:translateY(0) translateX(0);opacity:.2}50%{transform:translateY(-15px) translateX(10px);opacity:.8}}@keyframes beam-scan{0%{transform:translateX(-100%)}}.node-1{animation:pulse-node 3s infinite ease-in-out}.node-1,.node-2,.node-3{transform-box:fill-box;transform-origin:center}.node-2{animation:pulse-node 4s infinite ease-in-out 1s}.node-3{animation:pulse-node 3.5s infinite ease-in-out 2s}.line-flow{stroke-dasharray:12,12;animation:dash-flow 8s linear infinite}.line-flow-fast{stroke-dasharray:8,8;animation:dash-flow 4s linear infinite}.particle-1{animation:float-particle 5s infinite ease-in-out}.particle-2{animation:float-particle 7s infinite ease-in-out 1.5s}.particle-3{animation:float-particle 6s infinite ease-in-out 3s}</style></defs><rect width="1200" height="320" fill="url(#bg-gradient)"/><rect width="1200" height="320" fill="url(#grid)"/><circle cx="150" cy="80" r="180" fill="url(#purple-glow)" filter="url(#glow-shadow)" opacity=".3"/><circle cx="1050" cy="240" r="220" fill="url(#cyan-glow)" filter="url(#glow-shadow)" opacity=".25"/><g stroke-linecap="round"><path fill="none" stroke="#1e293b" stroke-width="2" d="M 50 260 Q 300 200 600 270 T 1150 160"/><path fill="none" stroke="#06b6d4" stroke-width="2" d="M 50 260 Q 300 200 600 270 T 1150 160" class="line-flow" opacity=".7"/><path fill="none" stroke="#1e293b" stroke-width="2" d="M 100 60 Q 450 140 800 50 T 1100 240"/><path fill="none" stroke="#3b82f6" stroke-width="2" d="M 100 60 Q 450 140 800 50 T 1100 240" class="line-flow-fast" opacity=".6"/><path fill="none" stroke="#8b5cf6" stroke-dasharray="6 6" stroke-width="1.5" d="M 200 280 L 400 60 L 850 280 L 1050 70" opacity=".3"/></g><g opacity=".8"><circle cx="300" cy="210" r="10" fill="#06b6d4" class="node-1"/><circle cx="300" cy="210" r="4" fill="#fff"/><circle cx="450" cy="115" r="12" fill="#3b82f6" class="node-2"/><circle cx="450" cy="115" r="5" fill="#fff"/><circle cx="800" cy="50" r="14" fill="#8b5cf6" class="node-3"/><circle cx="800" cy="50" r="6" fill="#fff"/><circle cx="950" cy="215" r="10" fill="#06b6d4" class="node-1"/><circle cx="950" cy="215" r="4" fill="#fff"/></g><g><circle cx="200" cy="120" r="3" fill="#38bdf8" class="particle-1"/><circle cx="700" cy="250" r="4" fill="#8b5cf6" class="particle-2"/><circle cx="1000" cy="100" r="3" fill="#06b6d4" class="particle-3"/><circle cx="500" cy="280" r="2" fill="#e0f2fe" class="particle-1"/></g><g filter="url(#text-shadow)"><rect width="480" height="32" x="360" y="42" fill="#1e293b" fill-opacity=".8" stroke="#38bdf8" stroke-opacity=".5" stroke-width="1" rx="16"/><text x="600" y="63" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" letter-spacing="2" text-anchor="middle">⚡ DEDICATED FABRICS • 100G/400G CONNECTIVITY ⚡</text><text x="600" y="145" fill="url(#text-gradient)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="46" font-weight="900" letter-spacing="-.5" text-anchor="middle">Awesome High-Speed Cloud Networking</text><text x="600" y="195" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="17" font-weight="500" letter-spacing=".5" text-anchor="middle">Curated Cloud Interconnects • eBPF &amp; DPDK Kernels • BGP Fabrics • Multi-Cloud SDN</text><g transform="translate(255, 235)"><rect width="200" height="36" x="0" y="0" fill="#0f172a" fill-opacity=".9" stroke="#0284c7" stroke-width="1.2" rx="18"/><text x="100" y="23" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" text-anchor="middle">☁️ AWS / Azure / GCP Links</text><rect width="240" height="36" x="220" y="0" fill="#0f172a" fill-opacity=".9" stroke="#8b5cf6" stroke-width="1.2" rx="18"/><text x="340" y="23" fill="#c084fc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" text-anchor="middle">🚀 Cilium • SONiC • DPDK • FRR</text><rect width="210" height="36" x="480" y="0" fill="#0f172a" fill-opacity=".9" stroke="#10b981" stroke-width="1.2" rx="18"/><text x="585" y="23" fill="#34d399" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" text-anchor="middle">🌐 Me